# Project-wide Gradle settings.

# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.

# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html

# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
org.gradle.jvmargs=-Xmx3072M -Dfile.encoding=UTF-8 -XX:+UseParallelGC
kotlin.daemon.jvmargs=-Xmx4G -XX:SurvivorRatio=12

# AndroidX package structure to make it clearer which packages are bundled with the
# Android operating system, and which are packaged with your app's APK
# https://developer.android.com/topic/libraries/support-library/androidx-rn
android.useAndroidX=true

# With de-coupled gradle sub-modules, they may run in parallel
org.gradle.parallel=true

# The default in the future, let's true the future now...
org.gradle.caching=true

# https://docs.gradle.org/current/userguide/configuration_cache.html
org.gradle.configuration-cache=true
org.gradle.configuration-cache.parallel=true

# Enable file system watching (should reduce disk IO and increase incremental build speed).
org.gradle.vfs.watch=true

# Enable Kotlin support for Android test fixtures
android.experimental.enableTestFixturesKotlinSupport=true

# Keeper does not tolerate newDsl in AGP9 yet
# it is fixed on a fork https://github.com/slackhq/keeper/pull/154#issuecomment-3921848493
# ...but keeper looking for long-term home, AGP9 compatibility is currently unpublished
# attempting to use the github maven repo package publish from that comment did not work initially
# perhaps can vendor a compiled lib / local maven repository for that plugin
android.newDsl=false

# Enable parallel sync for Gradle 9.4+ and Android Quail
# https://docs.gradle.org/current/userguide/build_environment.html#gradle_properties_reference
# https://developer.android.com/studio/releases/past-releases/as-quail-1-release-notes#android_studio_quail_1_parallel_gradle_sync_execution_change
org.gradle.tooling.parallel=true

kotlin_repo_url=https://packages.jetbrains.team/maven/p/kt/dev
kotlin_version=2.3.20-dev-3813
kotlin_api_version=2.3
kotlin_language_version=2.3

# added for testing
#kotlin_additional_cli_options=-Xreport-all-warnings -Xrender-internal-diagnostic-names

android.defaults.buildfeatures.buildconfig=true
android.nonTransitiveRClass=false
android.nonFinalResIds=false